<!DOCTYPE html>
<html>
<head>
    <title>Activity 4</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #1abc9c, #2c3e50);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        form {
            background-color: #ffffff;
            padding: 30px 35px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 420px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        td {
            padding: 8px 5px;
            vertical-align: top;
        }

        label {
            font-weight: bold;
            color: #2c3e50;
            font-size: 14px;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            transition: 0.3s ease;
            font-size: 14px;
        }

        input[type="text"]:focus,
        select:focus {
            border-color: #1abc9c;
            box-shadow: 0 0 6px rgba(26, 188, 156, 0.5);
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin: 5px;
            transition: 0.3s ease;
        }

        button[type="submit"] {
            background-color: #1abc9c;
            color: white;
        }

        button[type="submit"]:hover {
            background-color: #16a085;
        }

        button[type="reset"] {
            background-color: #2c3e50;
            color: white;
        }

        button[type="reset"]:hover {
            background-color: #1a252f;
        }
    </style>

</head>
<body>

    <form action="" method="post">
        <h2>User Information Form</h2>

        <table>

            <tr>
                <td><label for="fname">First Name:</label></td>
                <td><input type="text" id="fname" name="firstname" required></td>
            </tr>

            <tr>
                <td><label for="lname">Last Name:</label></td>
                <td><input type="text" id="lname" name="lastname" required></td>
            </tr>

            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="text" id="age" name="age" required></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" id="male" name="gender" value="male">
                    <label for="male">Male</label>

                    <input type="radio" id="female" name="gender" value="female">
                    <label for="female">Female</label>

                    <input type="radio" id="other" name="gender" value="other">
                    <label for="other">Other</label>
                </td>
            </tr>

            <tr>
                <td>Hobbies:</td>
                <td>
                    <input type="checkbox" id="hobby1" name="hobby" value="reading">
                    <label for="hobby1">Reading</label><br>

                    <input type="checkbox" id="hobby2" name="hobby" value="travelling">
                    <label for="hobby2">Travelling</label><br>

                    <input type="checkbox" id="hobby3" name="hobby" value="gaming">
                    <label for="hobby3">Gaming</label><br>

                    <input type="checkbox" id="hobby4" name="hobby" value="cooking">
                    <label for="hobby4">Cooking</label><br>

                    <input type="checkbox" id="hobby5" name="hobby" value="sports">
                    <label for="hobby5">Sports</label>
                </td>
            </tr>

            <tr>
                <td><label for="year-level">Year Level:</label></td>
                <td>
                    <select id="year-level" name="year_level">
                        <option value="1st-year">1st Year</option>
                        <option value="2nd-year">2nd Year</option>
                        <option value="3rd-year">3rd Year</option>
                        <option value="4th-year">4th Year</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align:center;">
                    <button type="submit">Submit</button>
                    <button type="reset">Clear</button>
                </td>
            </tr>

        </table>

    </form>

</body>
</html>
