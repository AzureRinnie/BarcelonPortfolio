<!DOCTYPE html>
<html>
    <head>
        <title>Activity 11</title>
        <script src="script.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div id="forLoop" class="loop-section">
                <h2>For Loop</h2>
                <form>
                    <label for="num1">Enter a number</label>
                    <input type="number" id="num1" name="num1"><br>
                    <label for="txt1">Enter a Text</label>
                    <input type="text" id="txt1" name="txt1"><br>
                    <button type="button" onclick="forLoop()">Show</button>
                    <button type="button" onclick="clearFields1()">Clear</button>
                </form>
                <p id="forResult" class="output"></p>
            </div>

            <div id="whileLoop" class="loop-section">
                <h2>While Loop</h2>
                <form>
                    <label for="num2">Enter a number</label>
                    <input type="number" id="num2" name="num2"><br>
                    <label for="txt2">Enter a Text</label>
                    <input type="text" id="txt2" name="txt2"><br>
                    <button type="button" onclick="whileLoop()">Show</button>
                    <button type="button" onclick="clearFields2()">Clear</button>
                </form>
                <p id="whileResult" class="output"></p>
            </div>

            <div id="doLoop" class="loop-section">
                <h2>Do-While Loop</h2>
                <form>
                    <label for="num3">Enter a number</label>
                    <input type="number" id="num3" name="num3"><br>
                    <label for="txt3">Enter a Text</label>
                    <input type="text" id="txt3" name="txt3"><br>
                    <button type="button" onclick="doLoop()">Show</button>
                    <button type="button" onclick="clearFields3()">Clear</button>
                </form>
                <p id="doResult" class="output"></p>
            </div>
        </div>
    </body>
</html>
